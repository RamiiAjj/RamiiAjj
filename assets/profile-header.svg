
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rami Abu Jabal — Computer Science and Software Development</title>
  <desc id="desc">A dark modern banner with cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#11182b"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientTransform="translate(1040 58) rotate(145) scale(440 270)">
      <stop stop-color="#22d3ee" stop-opacity=".28"/>
