    </radialGradient>
    <linearGradient id="line" x1="220" y1="0" x2="920" y2="0">
      <stop stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#cyan)"/>
  <rect width="1200" height="360" rx="28" fill="url(#violet)"/>
  <g opacity=".18" fill="none" stroke="#8fa6c9">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/>
    <path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
  </g>
